[package]
name = "tokenizer"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
emojis = "0.6"
rust-stemmers = "=1.2.0"
thiserror.workspace = true
# tinyvec 1.13.0 fails to compile with unicode-normalization's alloc-only features.
tinyvec = "=1.12.0"
unicode-normalization = "0.1.25"
unicode-properties = "0.1.4"
unicode-segmentation = { git = "https://github.com/eeeebbbbrrrr/unicode-segmentation.git", branch = "unicode-words-optimization" }

[dev-dependencies]
proptest = "1"
